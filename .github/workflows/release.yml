name: Release

# This fork is not published to npm: the `emulate` package names belong to the
# upstream project. Instead, every version bump on main builds the
# self-contained `emulate` tarball (it bundles all @emulators/* packages) and
# attaches it to a GitHub release. Consumers depend on the asset URL:
#
#   "emulate": "https://github.com/vitor-josepavel/emulate/releases/download/v0.13.0/emulate-0.13.0.tgz"

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-release:
    name: Check for new version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compare version to the latest GitHub release
        id: check
        run: |
          LOCAL_VERSION=$(node -p "require('./packages/emulate/package.json').version")
          if gh release view "v$LOCAL_VERSION" &>/dev/null; then
            echo "v$LOCAL_VERSION is already released"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$LOCAL_VERSION is not released yet"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Build and release
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check versions are in sync
        run: node scripts/sync-versions.mjs --check

      - name: Build
        run: pnpm build

      - name: Pack emulate
        id: pack
        run: |
          mkdir -p /tmp/release
          TARBALL=$(cd packages/emulate && pnpm pack --pack-destination /tmp/release | tail -1)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          ls -la /tmp/release

      - name: Extract changelog entry
        run: |
          awk '/<!-- release:start -->/{found=1; next} /<!-- release:end -->/{found=0} found{print}' CHANGELOG.md > /tmp/release-notes.md

          LINES=$(wc -l < /tmp/release-notes.md | tr -d ' ')
          if [ "$LINES" -lt 2 ]; then
            echo "Error: No release notes found between <!-- release:start --> and <!-- release:end --> markers in CHANGELOG.md"
            exit 1
          fi
          {
            echo ""
            echo "### Install"
            echo ""
            echo '```json'
            echo "\"emulate\": \"https://github.com/${{ github.repository }}/releases/download/v${{ needs.check-release.outputs.version }}/$(basename "${{ steps.pack.outputs.tarball }}")\""
            echo '```'
          } >> /tmp/release-notes.md

      - name: Create GitHub release
        run: |
          TAG="v${{ needs.check-release.outputs.version }}"
          gh release create "$TAG" "${{ steps.pack.outputs.tarball }}" \
            --title "$TAG" \
            --target ${{ github.sha }} \
            --notes-file /tmp/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
